*{margin:0;padding:0;box-sizing:border-box}
:root{

html,body{height:100%}
body{

  font-weight:400;

#navWrap{flex-shrink:0;margin:calc(var(--sidegap) - 8px) var(--sidegap) 0 var(--sidegap)}

.nav-tabs a:hover:not(.active){background:#e9e9e9}
.nav-tabs a.tab-about.active{background:#CBFF71;color:#000}
.nav-tabs a.tab-work.active{background:#FF8418;color:#000}
.nav-tabs a.tab-play.active{background:#00D0FF;color:#000}
.shell{flex:1;min-height:0;display:flex;gap:var(--midgap);margin:var(--midgap) var(--sidegap) var(--sidegap) var(--sidegap)}
#contentWrap{flex:1;min-width:0;background:#fff;border-radius:40px;overflow:hidden;position:relative}
#wrap{position:absolute;inset:0;overflow:hidden;cursor:grab}
#wrap:active{cursor:grabbing}
canvas{display:block}
#lbl{position:absolute;bottom:11%;left:50%;transform:translateX(-50%);background:#fff;color:#000;border:2px solid #000;border-radius:999px;padding:9px 34px;font-size:20px;font-weight:400;pointer-events:none;opacity:0;transition:opacity .35s,background .2s;white-space:nowrap;display:flex;align-items:center;gap:12px}
#lbl.on{opacity:1}
#lbl.clickable{pointer-events:auto;cursor:pointer}
#lbl.clickable:hover{background:#f4f4f4}
#hint{position:absolute;bottom:4.5%;left:50%;transform:translateX(-50%);font-size:12px;color:#c8c8c8;letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .35s}
#hint.on{opacity:1}
#err{position:absolute;top:10px;left:10px;right:10px;background:#fee;color:#a00;font:12px monospace;padding:10px;white-space:pre-wrap;display:none;z-index:999;border-radius:6px}

/* ── Intro rail: three stacked white frames, a column sibling of the content
   frame (same pattern as lumino.html's rail-frame/content-frame), sliding
   in from the left on load. ── */
#introRail{flex-shrink:0;width:360px;display:flex;flex-direction:column;gap:var(--midgap)}
.intro-frame{background:var(--paper,#fff);border-radius:28px;overflow:hidden;
  opacity:0;transform:translateX(-60px);animation:introSlide .6s cubic-bezier(.65,0,.35,1) forwards}
.intro-frame.id{padding:28px 28px 24px;container-type:inline-size}
.intro-frame.bio{padding:24px 28px;flex:1;min-height:0;display:flex;align-items:center}
.intro-frame.contact{padding:16px 20px}
.intro-frame:nth-child(1){animation-delay:.1s}
.intro-frame:nth-child(2){animation-delay:.22s}
.intro-frame:nth-child(3){animation-delay:.34s}
@keyframes introSlide{to{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.intro-frame{animation:none;opacity:1;transform:none}}
.no-intro-anim .intro-frame{animation:none;opacity:1;transform:none}
.intro-name{font-family:'Source Serif 4',serif;font-style:italic;font-weight:300;font-size:19.5cqi;line-height:1.1;color:#111;white-space:nowrap}
.intro-photo{margin-top:18px;width:100%;aspect-ratio:1/1;border-radius:16px;background:#d7d7d7;object-fit:cover;display:block}
.intro-bio{font-size:16px;font-weight:400;line-height:1.2;color:#111}
.intro-contact{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.intro-icons{display:flex;align-items:center;gap:10px}
.intro-email{font-size:14px;color:#111;text-decoration:none;border-bottom:1px solid rgba(17,17,17,.25);padding-bottom:2px}
.intro-email:hover{border-color:#111}
.intro-icon{width:34px;height:34px;flex-shrink:0;border-radius:999px;background:#f4f4f4;display:flex;align-items:center;justify-content:center;color:#111;text-decoration:none;transition:background .2s}
.intro-icon:hover{background:#e9e9e9}
.intro-icon svg{width:16px;height:16px}

/* ── Small screens: stack the sign frame below the intro rail instead of
   side-by-side, and let the page scroll since content no longer fits one
   fixed-height row. ── */
@media (max-width:860px){
  html,body{height:auto}
  body{overflow-y:auto}
  .shell{flex-direction:column;height:auto}
  #introRail{width:100%}
  .intro-frame.bio{flex:none}
  #contentWrap{min-height:420px}
}
</style>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(function(){

// ── Canvas polyfill ──────────────────────────────────────────────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y);this.closePath();return this;
  };
}

// ── Setup ────────────────────────────────────────────────────────────────
const wrap   = document.getElementById('wrap');
const canvas = document.getElementById('c');
const lbl    = document.getElementById('lbl');
const ltxt   = document.getElementById('ltxt');
const hint   = document.getElementById('hint');

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0xffffff);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
// Filmic tone mapping rolls bright highlights off smoothly instead of hard-
// clipping to flat white — needed because curved surfaces (Lumino's circle)
// can hit near-maximal diffuse response at some angle even under sane light
// levels, and a hard clip turns that into a stark blown-out patch.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42,1,0.1,200);
camera.position.set(4.5, 1.2, 11);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enablePan  = false;
controls.enableZoom = false;
controls.minPolarAngle = Math.PI/2 - 0.14;
controls.maxPolarAngle = Math.PI/2 + 0.14;
controls.rotateSpeed   = 0.48;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0.5, 0);
controls.update();

// ── Lights ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 1.35);
sun.position.set(6,12,8); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);
const fillL = new THREE.DirectionalLight(0xeaf0ff, 0.55);
fillL.position.set(-5,4,-6); scene.add(fillL);
const rimL = new THREE.DirectionalLight(0xffffff, 0.35);
rimL.position.set(0,-6,4); scene.add(rimL);

// ── Materials ────────────────────────────────────────────────────────────
const structureMaterial=new THREE.MeshStandardMaterial({
  color:0x2a2a2a, roughness:.6, metalness:.25
});
const M = {
  pole:  structureMaterial,
  hoop:  new THREE.MeshStandardMaterial({color:0x666666, roughness:.5,  metalness:.35}),
  back:  new THREE.MeshStandardMaterial({color:0xe6e7e8, roughness:.46, metalness:.4}),
  frame: new THREE.MeshStandardMaterial({color:0xf1f1ef, roughness:.42, metalness:.44}),
  arm:   structureMaterial,
};

// ── Placeholder textures ─────────────────────────────────────────────────
function mkTex(fn){
  const cv=document.createElement('canvas'); cv.width=cv.height=512;
  fn(cv.getContext('2d'),512); return new THREE.CanvasTexture(cv);
}
function label(ctx,s,txt,col){
  col = col || 'rgba(255,255,255,0.92)';
  ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle';
  const words=txt.split(' '), fs=words.length>2?38:44;
  ctx.font='bold '+fs+'px -apple-system,Helvetica';
  const lh=fs*1.25, lines=[]; let cur='';
  words.forEach(w=>{
    const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width>s-60){ lines.push(cur); cur=w; } else cur=t;
  }); lines.push(cur);
  const startY=s*.86-((lines.length-1)*lh)/2;
  lines.forEach((l,i)=>ctx.fillText(l,s/2,startY+i*lh));
}

const TEX = {
  whoAmI: mkTex((c,s)=>{
    const g=c.createLinearGradient(0,0,s,s);
    g.addColorStop(0,'#d4673e'); g.addColorStop(1,'#b84d2a');
    c.fillStyle=g; c.fillRect(0,0,s,s);
    c.strokeStyle='rgba(255,200,160,.3)'; c.lineWidth=15;
    for(let i=-s;i<s*2;i+=70){c.beginPath();c.moveTo(i,0);c.lineTo(i+s,s);c.stroke();}
    c.strokeStyle='rgba(255,255,255,.2)'; c.lineWidth=22;
    c.beginPath(); c.arc(s/2,s*.42,s*.28,0,Math.PI*2); c.stroke();
    label(c,s,'Who Am I');
  }),
  artisk: new THREE.TextureLoader().load('images/ArtiskSign.svg'),
  lumino: new THREE.TextureLoader().load('images/LuminoSign.png'),
  remember: new THREE.TextureLoader().load('images/RememberSign.png'),
  proj4: mkTex((c,s)=>{
    c.fillStyle='#d42c3e'; c.fillRect(0,0,s,s);
    const tri=(ax,ay,bx,by,cx2,cy2,col)=>{
      c.beginPath(); c.moveTo(ax*s,ay*s); c.lineTo(bx*s,by*s); c.lineTo(cx2*s,cy2*s);
      c.closePath(); c.fillStyle=col; c.fill();
    };
    tri(.5,.06,.86,.46,.14,.46,'rgba(255,225,45,.7)');
    tri(.14,.46,.5,.06,.5,.5,'rgba(255,255,255,.28)');
    tri(.5,.5,.86,.46,.5,.06,'rgba(255,90,40,.38)');
    tri(.1,.56,.5,.56,.3,.82,'rgba(90,235,255,.62)');
    tri(.5,.56,.9,.56,.7,.82,'rgba(255,255,255,.38)');
    label(c,s,'Project 04');
  }),
  proj5: mkTex((c,s)=>{
    c.fillStyle='#101e62'; c.fillRect(0,0,s,s);
    const cols=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f43'];
    let ci=0;
    for(let r=0;r<5;r++) for(let cl=0;cl<7;cl++){
      c.beginPath(); c.arc((cl+.5)*s/7,(r+.5)*s/6,s*.048,0,Math.PI*2);
      c.fillStyle=cols[ci++%cols.length]; c.fill();
    }
    label(c,s,'Project 05');
  }),
};

// Treat the artwork as printed colour rather than a reflective surface.
// Explicit sRGB encoding keeps both image files and canvas textures from
// looking muted when rendered through the WebGL colour pipeline.
Object.keys(TEX).forEach(key=>{
  TEX[key].encoding=THREE.sRGBEncoding;
});

// ── Shape helpers ────────────────────────────────────────────────────────
function rrShape(w,h,r){
  r = r || 0.11;
  const s=new THREE.Shape();
  s.moveTo(-w/2+r,-h/2); s.lineTo(w/2-r,-h/2); s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  s.lineTo(w/2,h/2-r);   s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  s.lineTo(-w/2+r,h/2);  s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  s.lineTo(-w/2,-h/2+r); s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  s.closePath(); return s;
}
function triShape(w,h,r){
  r = r || 0.13;
  const verts=[new THREE.Vector2(0,h/2),new THREE.Vector2(w/2,-h/2),new THREE.Vector2(-w/2,-h/2)];
  const s=new THREE.Shape();
  for(let i=0;i<3;i++){
    const p=verts[i],prev=verts[(i+2)%3],next=verts[(i+1)%3];
    const d1=new THREE.Vector2().subVectors(prev,p).normalize().multiplyScalar(r);
    const d2=new THREE.Vector2().subVectors(next,p).normalize().multiplyScalar(r);
    if(i===0) s.moveTo(p.x+d1.x,p.y+d1.y); else s.lineTo(p.x+d1.x,p.y+d1.y);
    s.quadraticCurveTo(p.x,p.y,p.x+d2.x,p.y+d2.y);
  }
  s.closePath(); return s;
}
function circleShape(r){
  const s=new THREE.Shape();
  s.absarc(0,0,r,0,Math.PI*2,false);
  return s;
}

// ShapeGeometry inherits world-space UVs, which clips or repeats artwork when
// signs use different dimensions. Remap every front face to a full 0–1 UV box
// so each artwork fills its complete visible sign aperture.
function fitGeometryUVs(geo,textureAspect){
  geo.computeBoundingBox();
  const box=geo.boundingBox;
  const dx=box.max.x-box.min.x || 1;
  const dy=box.max.y-box.min.y || 1;
  const pos=geo.attributes.position;
  const uv=geo.attributes.uv;
  for(let i=0;i<pos.count;i++){
    let u=(pos.getX(i)-box.min.x)/dx;
    // When an artwork aspect is supplied, fit its full height to the plate and
    // crop equal amounts from the left and right instead of stretching it.
    if(textureAspect){
      const visibleWidth=(dx/dy)/textureAspect;
      u=.5+(u-.5)*visibleWidth;
    }
    uv.setXY(i,u,(pos.getY(i)-box.min.y)/dy);
  }
  uv.needsUpdate=true;
  return geo;
}

// ── Pole ─────────────────────────────────────────────────────────────────
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.11,.135,14,20), M.pole);
scene.add(pole);

// Low-profile clamp bands at varied heights, matching the hardware in the
// reference rather than reading as oversized rings around the pole.
[-4.3,-2.9,-1.4,.2,1.5,2.8,4.0].forEach(y=>{
  const h=new THREE.Mesh(new THREE.CylinderGeometry(.145,.145,.075,24),M.hoop);
  h.position.y=y; scene.add(h);
});

// ── Signs ────────────────────────────────────────────────────────────────
// Each sign sits at its own angle around the pole (deg): a short bracket
// reaches out radially from the pole, then the board itself extends further
// outward like a fingerpost — its length runs along the radial direction,
// and its flat face reads tangentially (sideways), not straight out at the
// pole. A sign at 25° shows its face to someone standing near 25°+90°/-90°
// around the pole; the back shows from the opposite tangential side.
const DEFS=[
  {label:'Who Am I',        key:'whoAmI',   shape:'square',   w:2.2, h:2.2,  y:4.4,   deg:25},
  {label:'Artisk Redesign', key:'artisk',   shape:'hrect',    w:3.3, h:1.65, y:-0.9,  deg:70, textureAspect:1395/384},
  {label:'Lumino',          key:'lumino',   shape:'square',   w:2.1, h:2.1,  y:0.8,   deg:140},
  {label:'Remember',        key:'remember', shape:'circle',   w:2.1, h:2.1,  y:2.55,  deg:195},
  {label:'Project 04',      key:'proj4',    shape:'triangle', w:2.3, h:2.0,  y:-2.5,  deg:250},
  {label:'Project 05',      key:'proj5',    shape:'hrect',    w:2.85,h:1.45, y:-3.85, deg:310},
];

const PROJECT_PAGES={artisk:'artisk.html',lumino:'lumino.html',remember:'remember.html'};
const clickables=[];

function buildSign(def){
  const shape=def.shape,w=def.w,h=def.h,y=def.y,key=def.key;
  const angle = def.deg * Math.PI/180;
  const D=.026, FRONT_BW=.13, REAR_BW=.18;
  const BODY_BEV_T=.005, REAR_RIM_DEPTH=.04, REAR_RIM_BEV_T=.014;
  const ARM_RADIUS=.024, REAR_CLEARANCE=.006;
  const fmat=new THREE.MeshBasicMaterial({map:TEX[key],toneMapped:false});

  const grp=new THREE.Group();
  grp.rotation.y=angle; grp.position.y=y; scene.add(grp);

  // Silver ball joint and slim black rod, as in the reference hardware.
  // The rod continues across the rear face to a central mounting point, so it
  // remains visible when the viewer rotates around to the back of the sign.
  const jointZ=.12;
  const armLen=.5;
  const signCenterZ=jointZ+armLen+w/2;
  // Keep the complete rod behind the outermost rear-rim bevel. This explicit
  // radius + clearance prevents the small edge intersection visible on the
  // Remember sign while preserving the same bracket layout for every sign.
  const rearMountX=-(D/2+BODY_BEV_T+REAR_RIM_DEPTH+
    REAR_RIM_BEV_T+ARM_RADIUS+REAR_CLEARANCE);
  const bolt=new THREE.Mesh(new THREE.SphereGeometry(.034,12,12),M.hoop);
  bolt.position.set(rearMountX,0,jointZ); grp.add(bolt);

  const rodLen=signCenterZ-jointZ;
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(
    ARM_RADIUS,ARM_RADIUS,rodLen,10),M.arm);
  arm.rotation.x=Math.PI/2;
  arm.position.set(rearMountX,0,(jointZ+signCenterZ)/2); grp.add(arm);

  const backMount=new THREE.Mesh(new THREE.SphereGeometry(.038,12,12),M.hoop);
  backMount.position.set(rearMountX,0,signCenterZ); grp.add(backMount);

  // sign board: rotated 90° so its length runs radially (like a fingerpost)
  // and its flat face reads tangentially instead of pointing straight out
  const sg=new THREE.Group();
  sg.rotation.y=Math.PI/2;
  sg.position.z=signCenterZ; grp.add(sg);

  const hit=[];

  // A thin, flat aluminium base carries one independent embossed rim on each
  // side. The rear centre itself remains a single uninterrupted flat surface.
  const bodyBevT=BODY_BEV_T, bodyBevS=.009;
  const ringDepth=.028, ringBevT=.011, ringBevS=.017;
  const rearRimBevT=REAR_RIM_BEV_T, rearRimBevS=.021;
  function mkRing(outerShape, holeShape, curveSegs, depth, bevelT, bevelS,material){
    const rs=outerShape.clone(); rs.holes.push(holeShape.clone());
    const geo=new THREE.ExtrudeGeometry(rs,{depth:depth,bevelEnabled:true,
      bevelThickness:bevelT,bevelSize:bevelS,bevelSegments:6,curveSegments:curveSegs});
    return new THREE.Mesh(geo,material);
  }

  const curveSegs=shape==='circle'?48:20;
  const sh=shape==='circle'?circleShape(w/2):
    shape==='triangle'?triShape(w,h):rrShape(w,h);
  function insetShape(amount){
    return shape==='circle'?circleShape(w/2-amount):
      shape==='triangle'?triShape(w-amount*2,h-amount*2,.13):
      rrShape(w-amount*2,h-amount*2,.11);
  }
  const ish=insetShape(FRONT_BW);
  const rearInner=insetShape(REAR_BW);

  // The base is one solid thin plate, so its rear cap is completely flat.
  const bodyGeo=new THREE.ExtrudeGeometry(sh,{depth:D,bevelEnabled:true,
    bevelThickness:bodyBevT,bevelSize:bodyBevS,bevelSegments:5,curveSegments:curveSegs});
  const body=new THREE.Mesh(bodyGeo,M.back);
  body.position.z=-D/2; sg.add(body); hit.push(body);

  const frontZ=D/2+bodyBevT+.002;
  const frontGeo=fitGeometryUVs(new THREE.ShapeGeometry(ish),def.textureAspect);
  const front=new THREE.Mesh(frontGeo,fmat);
  front.position.z=frontZ+.002; sg.add(front); hit.push(front);
  const frontRing=mkRing(sh,ish,curveSegs,ringDepth,ringBevT,ringBevS,M.frame);
  frontRing.position.z=frontZ; sg.add(frontRing); hit.push(frontRing);

  // Add one raised rim directly on top of the flat rear face. There is no
  // second groove ring or inset panel underneath it.
  const rearSurface=-D/2-bodyBevT;
  const rearRaisedRim=mkRing(sh,rearInner,curveSegs,
    REAR_RIM_DEPTH,rearRimBevT,rearRimBevS,M.frame);
  rearRaisedRim.rotation.y=Math.PI;
  rearRaisedRim.position.z=rearSurface;
  sg.add(rearRaisedRim); hit.push(rearRaisedRim);

  hit.forEach(m=>{ m.userData.sign={def:def,grp:grp,sg:sg,angle:angle}; clickables.push(m); });
  return {def:def,grp:grp,sg:sg,angle:angle};
}

DEFS.forEach(buildSign);

// ── Animation helpers ────────────────────────────────────────────────────
function eio(t){return t<.5?2*t*t:-1+(4-2*t)*t}
const tweens=[];
function tween(fromCam,toCam,fromTgt,toTgt,dur,onDone){
  tweens.push({t:0,dur:dur,
    fc:fromCam.clone(),tc:toCam.clone(),
    ft:fromTgt.clone(),tt:toTgt.clone(),onDone:onDone});
}

// ── Focus state ──────────────────────────────────────────────────────────
let focused=null, busy=false;
const savedCam=new THREE.Vector3(), savedTgt=new THREE.Vector3();

function focusSign(entry){
  if(busy) return; busy=true; focused=entry;
  savedCam.copy(camera.position); savedTgt.copy(controls.target);
  controls.enabled=false;

  const sgp=new THREE.Vector3();
  entry.sg.getWorldPosition(sgp);

  const q=new THREE.Quaternion();
  entry.sg.getWorldQuaternion(q);
  const frontDir=new THREE.Vector3(0,0,1).applyQuaternion(q);
  const toCam=sgp.clone().addScaledVector(frontDir,3.8);
  toCam.y=sgp.y+.25;

  tween(camera.position,toCam,controls.target,sgp,.65,function(){
    busy=false;
    ltxt.textContent=entry.def.label;
    lbl.classList.add('on'); hint.classList.add('on');
    const page=PROJECT_PAGES[entry.def.key];
    if(page){
      lbl.classList.add('clickable');
      lbl.onclick=function(e){
        e.stopPropagation();
        window.CaseTransitions.navigate(page);
      };
    } else {
      lbl.classList.remove('clickable');
      lbl.onclick=null;
    }
  });
}

function unfocus(){
  if(busy||!focused) return; busy=true;
  lbl.classList.remove('on','clickable'); lbl.onclick=null; hint.classList.remove('on');
  tween(camera.position,savedCam,controls.target,savedTgt,.55,function(){
    focused=null; busy=false; controls.enabled=true;
  });
}

// ── Click ────────────────────────────────────────────────────────────────
const ray=new THREE.Raycaster(), mp=new THREE.Vector2();
let drag=false;
canvas.addEventListener('pointerdown',function(){drag=false;});
canvas.addEventListener('pointermove',function(){drag=true;});
canvas.addEventListener('pointerup',function(e){
  if(drag||busy) return;
  const r=wrap.getBoundingClientRect();
  mp.x=((e.clientX-r.left)/r.width)*2-1;
  mp.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mp,camera);
  const hits=ray.intersectObjects(clickables);
  if(hits.length){ const s=hits[0].object.userData.sign; focused?unfocus():focusSign(s); }
  else if(focused) unfocus();
});

// ── Resize ───────────────────────────────────────────────────────────────
function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}
resize(); new ResizeObserver(resize).observe(wrap);

// ── Loop ─────────────────────────────────────────────────────────────────
const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=clock.getDelta();
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    tw.t=Math.min(tw.t+dt/tw.dur,1);
    const e=eio(tw.t);
    camera.position.lerpVectors(tw.fc,tw.tc,e);
    controls.target.lerpVectors(tw.ft,tw.tt,e);
    camera.lookAt(controls.target);
    if(tw.t>=1){tweens.splice(i,1); if(tw.onDone) tw.onDone();}
  }
  controls.update();
  renderer.render(scene,camera);
})();

})();
</script>
