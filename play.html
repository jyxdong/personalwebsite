<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Play — Portfolio</title>
<style>
/* ── Reset ─────────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --canvas:#D7D7D7;
  --paper:#ffffff;
  --ink:#111111;
  --muted:#63625f;
  --faint:#9a9a97;
  --line:rgba(17,17,17,.10);
  --accent:#00D0FF;

  --sidegap:24px;
  --midgap:8px;
  --r-lg:40px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-weight:400;
  color:var(--ink);
  background:var(--canvas);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ── Nav — reused verbatim from lumino.html ──────────────────────────────── */
#navWrap{flex-shrink:0;margin:calc(var(--sidegap) - 8px) var(--sidegap) 0 var(--sidegap)}
nav{background:#fff;border-radius:999px;display:flex;align-items:center;gap:10px;padding:8px 10px}
.nav-tabs{flex:1;display:flex;justify-content:center;gap:10px}
.nav-tabs a{flex:1;max-width:260px;height:40px;border-radius:999px;border:none;cursor:pointer;font-size:20px;font-weight:400;background:#f4f4f4;color:#000;transition:background .2s;display:flex;align-items:center;justify-content:center;text-decoration:none}
.nav-tabs a:hover:not(.active){background:#e9e9e9}
.nav-tabs a.tab-about.active{background:#CBFF71;color:#000}
.nav-tabs a.tab-work.active{background:#FF8418;color:#000}
.nav-tabs a.tab-play.active{background:#00D0FF;color:#000}
.nav-icon-btn{flex:0 0 40px;width:40px;height:40px;border-radius:999px;border:none;cursor:pointer;background:#f4f4f4;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .2s;text-decoration:none}
.nav-icon-btn svg{width:18px;height:18px}
.nav-icon-btn:hover{background:#e9e9e9}

/* ── Shell: same fixed viewport-height frame as lumino.html — the white
   frame is static, only the div inside it scrolls, so rubber-band
   overscroll never exposes the gray canvas behind it. ──────────────────── */
.shell{flex:1;min-height:0;display:flex;padding:var(--midgap) var(--sidegap) var(--sidegap) var(--sidegap)}
.content-frame{
  flex:1;
  min-width:0;
  background:var(--paper);
  border-radius:var(--r-lg);
  overflow:hidden;
}
#pageScroll{
  height:100%;
  background:var(--paper);
  overflow-y:auto;
}

/* ── Mobile: drop the fixed app-shell, let the page scroll normally ─────── */
@media (max-width:960px){
  html,body{height:auto;overflow:visible}
  body{display:block}
  #navWrap{margin:16px 16px 0}
  .shell{display:block;height:auto;padding:8px 16px 16px}
  .content-frame{overflow:visible;border-radius:24px}
  #pageScroll{height:auto;overflow:visible}
}
</style>
</head>
<body>

<div id="navWrap">
  <nav>
    <div class="nav-tabs">
      <a href="index.html" class="tab-about">About</a>
      <a href="work.html" class="tab-work">Work</a>
      <a href="play.html" class="tab-play active">Play</a>
    </div>
    <a class="nav-icon-btn" href="https://drive.google.com/file/d/1VkgR9_d0P5G2in3TYsN-1l_7hXY_21DG/view?usp=sharing" target="_blank" rel="noopener noreferrer" aria-label="Resume">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6"/>
        <line x1="8" y1="13" x2="16" y2="13"/>
        <line x1="8" y1="17" x2="16" y2="17"/>
      </svg>
    </a>
  </nav>
</div>

<div class="shell">
  <div class="content-frame">
    <div id="pageScroll">
    </div>
  </div>
</div>

</body>
</html>
