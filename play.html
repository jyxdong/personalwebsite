<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Play — Portfolio</title>

<style>
/* ── Reset ─────────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --canvas:#D7D7D7;
  --paper:#ffffff;
  --ink:#111111;
  --muted:#63625f;
  --faint:#9a9a97;
  --line:rgba(17,17,17,.10);
  --accent:#00D0FF;

  --sidegap:24px;
  --midgap:8px;
  --r-lg:40px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-weight:400;
  color:var(--ink);
  background:var(--canvas);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ── Nav ──────────────────────────────────────────────────────────────── */
#navWrap{flex-shrink:0;margin:calc(var(--sidegap) - 8px) var(--sidegap) 0 var(--sidegap)}
nav{background:#fff;border-radius:999px;display:flex;align-items:center;gap:10px;padding:8px 10px}
.nav-tabs{flex:1;display:flex;justify-content:center;gap:10px}
.nav-tabs a{flex:1;max-width:260px;height:40px;border-radius:999px;border:none;cursor:pointer;font-size:20px;font-weight:400;background:#f4f4f4;color:#000;transition:background .2s;display:flex;align-items:center;justify-content:center;text-decoration:none}
.nav-tabs a:hover:not(.active){background:#e9e9e9}
.nav-tabs a.tab-about.active{background:#CBFF71;color:#000}
.nav-tabs a.tab-work.active{background:#FF8418;color:#000}
.nav-tabs a.tab-play.active{background:#00D0FF;color:#000}
.nav-icon-btn{flex:0 0 40px;width:40px;height:40px;border-radius:999px;border:none;cursor:pointer;background:#f4f4f4;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .2s;text-decoration:none}
.nav-icon-btn svg{width:18px;height:18px}
.nav-icon-btn:hover{background:#e9e9e9}

/* ── Shell: left intro rail (identical to index.html) + right content frame ── */
.shell{flex:1;min-height:0;display:flex;gap:var(--midgap);margin:var(--midgap) var(--sidegap) var(--sidegap) var(--sidegap)}

/* ── Intro rail: three stacked white frames, same markup/animation as
   index.html so the "left three columns" read as the same element when
   navigating between About and Play. ── */
#introRail{flex-shrink:0;width:360px;display:flex;flex-direction:column;gap:var(--midgap)}
.intro-frame{background:var(--paper);border-radius:28px;overflow:hidden;
  opacity:0;transform:translateX(-60px);animation:introSlide .6s cubic-bezier(.65,0,.35,1) forwards}
.intro-frame.id{padding:28px 28px 24px;container-type:inline-size}
.intro-frame.bio{padding:24px 28px;flex:1;min-height:0;display:flex;align-items:center}
.intro-frame.contact{padding:16px 20px}
.intro-frame:nth-child(1){animation-delay:.1s}
.intro-frame:nth-child(2){animation-delay:.22s}
.intro-frame:nth-child(3){animation-delay:.34s}
@keyframes introSlide{to{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.intro-frame{animation:none;opacity:1;transform:none}}

/* Coming straight from the About page: the rail is already in the exact
   same place, so skip the slide-in replay and just show it in place. */
.no-intro-anim .intro-frame{animation:none;opacity:1;transform:none}

.intro-name{font-family:'Source Serif 4',serif;font-style:italic;font-weight:300;font-size:19.5cqi;line-height:1.1;color:#111;white-space:nowrap}
.intro-photo{margin-top:18px;width:100%;aspect-ratio:1/1;border-radius:16px;background:#d7d7d7;object-fit:cover;display:block}
.intro-bio{font-size:16px;font-weight:400;line-height:1.2;color:#111}
.intro-contact{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.intro-icons{display:flex;align-items:center;gap:10px}
.intro-email{font-size:14px;color:#111;text-decoration:none;border-bottom:1px solid rgba(17,17,17,.25);padding-bottom:2px}
.intro-email:hover{border-color:#111}
.intro-icon{width:34px;height:34px;flex-shrink:0;border-radius:999px;background:#f4f4f4;display:flex;align-items:center;justify-content:center;color:#111;text-decoration:none;transition:background .2s}
.intro-icon:hover{background:#e9e9e9}
.intro-icon svg{width:16px;height:16px}

/* ── Content frame: white box holding the three-column masonry ──────────── */
.content-frame{flex:1;min-width:0;background:var(--paper);border-radius:var(--r-lg);overflow:hidden;position:relative}
#pageScroll{height:100%;background:var(--paper);overflow-y:auto}

/* ── Waterfall grid: three columns at a 1 : 1.6 : 1 width ratio, each a
   vertical stack of gray placeholder cards of varying height. ── */
.grid-wrap{padding:32px}
.waterfall{display:flex;gap:20px;align-items:flex-start}
.waterfall-col{display:flex;flex-direction:column;gap:20px;min-width:0}
.waterfall-col.narrow{flex:1}
.waterfall-col.wide{flex:1.6}
.ph-card{background:#e4e4e4;border-radius:22px;width:100%;transform-origin:center center;
  transition:transform .75s cubic-bezier(.16,1,.3,1)}
.ph-card.h-sm{aspect-ratio:1/0.75}
.ph-card.h-md{aspect-ratio:1/1}
.ph-card.h-lg{aspect-ratio:1/1.3}
.ph-card.h-xl{aspect-ratio:1/1.6}

/* ── Stacked state: on entry all cards collapse to a rotated deck at the
   center of the frame; a click disperses them into the grid above. ── */
.waterfall.stacked .ph-card{
  transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(var(--scale));
  z-index:var(--z);
}
.content-frame.stacked{cursor:pointer}

/* ── Image card: preserves the source image's own aspect ratio so it shows
   whole, uncropped, both in the grid and when expanded. ── */
.ph-card.img-card{overflow:hidden}
.ph-card.img-card img{width:100%;height:100%;object-fit:cover;display:block}

/* ── Play item: click detaches the card (+ its caption) from the grid and
   floats it to the center of the frame; click again to send it back. ── */
.play-item{cursor:pointer;transform-origin:center center}
.play-item.expanded{position:absolute;top:0;left:0;z-index:70;cursor:zoom-out}
.play-item.expanded .ph-card{cursor:default}

.play-scrim{position:absolute;inset:0;background:rgba(255,255,255,.85);opacity:0;
  pointer-events:none;transition:opacity .4s ease;z-index:60}
.play-scrim.active{opacity:1;pointer-events:auto}

/* Caption only reveals once the card has finished floating to center. */
.img-card-caption{margin-top:12px;font-size:14px;line-height:1.5;color:var(--muted);
  opacity:0;transition:opacity .35s ease}
.img-card-caption.visible{opacity:1}

/* ── Mobile: drop the fixed app-shell, let the page scroll normally ─────── */
@media (max-width:960px){
  html,body{height:auto;overflow:visible}
  body{display:block}
  #navWrap{margin:16px 16px 0}
  .shell{flex-direction:column;height:auto;margin:8px 16px 16px}
  #introRail{width:100%}
  .content-frame{overflow:visible;border-radius:24px}
  #pageScroll{height:auto;overflow:visible}
  .grid-wrap{padding:20px}
  .waterfall{flex-direction:column}
  .waterfall-col.narrow,.waterfall-col.wide{flex:1}
}
</style>
</head>
<body>
<script>

<div id="navWrap">

</div>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>

          </div>
          <div class="waterfall-col wide">
            <div class="play-item" id="playItem">
              <div class="ph-card img-card" id="playCard" style="aspect-ratio:9154/5945">
                <img src="images/PlayStardewValley.webp" alt="Stardew Valley"/>
              </div>

            </div>

          <div class="waterfall-col narrow">
            <div class="ph-card h-xl"></div>

<script>
(function(){
  var frame = document.getElementById('contentFrame');
  var waterfall = document.getElementById('waterfall');
  var cards = Array.prototype.slice.call(waterfall.querySelectorAll('.ph-card'));
  var rotations = [-7,5,-4,8,-6,3,6,-3,4,-8,7,-5];

  var frameRect = frame.getBoundingClientRect();
  var cx = frameRect.left + frameRect.width/2;
  var cy = frameRect.top + frameRect.height/2;

  cards.forEach(function(card,i){
    var r = card.getBoundingClientRect();
    var dx = cx - (r.left + r.width/2);
    var dy = cy - (r.top + r.height/2);
    var scale = 170 / r.width;
    card.style.setProperty('--dx', dx+'px');
    card.style.setProperty('--dy', dy+'px');
    card.style.setProperty('--rot', rotations[i % rotations.length]+'deg');
    card.style.setProperty('--scale', scale.toFixed(3));
    card.style.setProperty('--z', cards.length - i);
  });

  waterfall.classList.add('stacked');
  frame.classList.add('stacked');

  frame.addEventListener('click', function(){
    waterfall.classList.remove('stacked');
    frame.classList.remove('stacked');
  }, {once:true});

  // ── Play item: click detaches the card (+ caption) from the grid and
  // floats it to the center of the frame (FLIP animation); click again
  // (or the scrim) sends it back. Caption only fades in once it's settled.
  var playItem = document.getElementById('playItem');
  var playCaption = playItem.querySelector('.img-card-caption');
  var scrim = document.getElementById('playScrim');
  var isExpanded = false;

  function flip(applyChanges){
    var first = playItem.getBoundingClientRect();
    applyChanges();
    var last = playItem.getBoundingClientRect();
    var dx = (first.left+first.width/2) - (last.left+last.width/2);
    var dy = (first.top+first.height/2) - (last.top+last.height/2);
    var scale = last.width ? first.width/last.width : 1;
    playItem.style.transition = 'none';
    playItem.style.transform = 'translate('+dx+'px,'+dy+'px) scale('+scale+')';
    playItem.getBoundingClientRect(); // force reflow
    requestAnimationFrame(function(){
      playItem.style.transition = 'transform .6s cubic-bezier(.16,1,.3,1)';
      playItem.style.transform = 'translate(0,0) scale(1)';
    });
  }

  function expand(){
    isExpanded = true;
    var frameRect = frame.getBoundingClientRect();
    flip(function(){
      playItem.classList.add('expanded');
      var w = Math.min(frame.clientWidth*0.6, 560);
      playItem.style.width = w+'px';
      playItem.style.left = '0px';
      playItem.style.top = '0px';
      var r = playItem.getBoundingClientRect();
      playItem.style.left = (frameRect.width/2 - r.width/2)+'px';
      playItem.style.top = (frameRect.height/2 - r.height/2)+'px';
    });
    scrim.classList.add('active');
    playItem.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName !== 'transform') return;
      playItem.removeEventListener('transitionend', onEnd);
      if(isExpanded) playCaption.classList.add('visible');
    });
  }

  function collapse(){
    isExpanded = false;
    playCaption.classList.remove('visible');
    flip(function(){
      playItem.classList.remove('expanded');
      playItem.style.width = '';
      playItem.style.left = '';
      playItem.style.top = '';
    });
    scrim.classList.remove('active');
    playItem.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName !== 'transform') return;
      playItem.removeEventListener('transitionend', onEnd);
      playItem.style.transition = '';
      playItem.style.transform = '';
    });
  }

  playItem.addEventListener('click', function(e){
    if(waterfall.classList.contains('stacked')) return; // let it disperse first
    e.stopPropagation();
    if(isExpanded) collapse(); else expand();
  });
  scrim.addEventListener('click', function(){
    if(isExpanded) collapse();
  });
})();
</script>
